name: CI

on:
  push:
    branches:
      - main
      - tag-rec
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      RELEASE: 'true'
      MINIFY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build:scss _typecheck _lint
      - run: pnpm exec vitest run src
      - run: node --test scripts/release-licenses.test.mjs
      - run: pnpm build:vite
